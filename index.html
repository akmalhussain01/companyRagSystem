<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#12161C',
                        panel: '#1A2029',
                        line: '#2A3140',
                        gold: '#B4863A',
                    },
                }
            }
        }
    </script>
    <style>
        @keyframes dotPulse {
            0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-2px); }
        }
        .dot { animation: dotPulse 1.1s ease-in-out infinite; }
        .dot:nth-child(2) { animation-delay: 0.15s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }

        #log { scrollbar-width: thin; scrollbar-color: #2A3140 transparent; }
        #log::-webkit-scrollbar { width: 6px; }
        #log::-webkit-scrollbar-thumb { background: #2A3140; border-radius: 4px; }
    </style>
</head>
<body class="bg-ink text-slate-200 antialiased h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-line px-4 sm:px-6 py-4 flex items-center gap-3 shrink-0">
        <div class="h-9 w-9 rounded-md bg-gold/15 border border-gold/40 flex items-center justify-center text-gold font-semibold text-sm shrink-0">
            NX
        </div>
        <div class="min-w-0">
            <h1 class="text-sm font-medium text-slate-100 truncate">Nexora Assistant</h1>
            <p class="text-xs text-slate-500 truncate">Answers grounded in the employee handbook</p>
        </div>
        <span id="status-pill" class="ml-auto hidden sm:flex items-center gap-1.5 text-xs text-slate-500 border border-line rounded-full px-2.5 py-1">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
            Ready
        </span>
    </header>

    <!-- Message log -->
    <main id="log" class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 space-y-5 max-w-3xl w-full mx-auto">
        <div class="flex gap-3">
            <div class="h-7 w-7 rounded-md bg-panel border border-line flex items-center justify-center text-gold text-xs font-semibold shrink-0">NX</div>
            <div class="bg-panel border border-line rounded-2xl rounded-tl-sm px-4 py-3 text-sm leading-relaxed max-w-[85%] sm:max-w-[75%]">
                Ask me anything about company policy \u2014 leave, security, training, or conduct.
            </div>
        </div>
    </main>

    <!-- Composer -->
    <footer class="border-t border-line px-4 sm:px-6 py-4 shrink-0">
        <form id="composer" class="max-w-3xl w-full mx-auto flex items-end gap-2 sm:gap-3">
            <textarea
                id="question-input"
                rows="1"
                placeholder="Ask a question about company policy..."
                class="flex-1 resize-none bg-panel border border-line rounded-xl px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-gold/50 focus:border-gold/50 max-h-40"
            ></textarea>
            <button
                type="submit"
                id="send-btn"
                class="shrink-0 h-11 w-11 rounded-xl bg-gold text-ink font-medium flex items-center justify-center hover:bg-gold/90 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                aria-label="Send question"
            >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
                    <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/>
                </svg>
            </button>
        </form>
        <p class="max-w-3xl w-full mx-auto text-[11px] text-slate-600 mt-2 px-1">Enter to send \u00b7 Shift+Enter for a new line</p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
